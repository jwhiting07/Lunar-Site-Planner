  <path d="M159 84 C139 84 124 99 124 118 C124 134 143 155 159 179 C176 155 194 134 194 118 C194 99 179 84 159 84Z" fill="#FFFFFF" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
