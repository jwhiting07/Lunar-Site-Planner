<script>
(() => {
  const root = document.getElementById('seraphim-designs');
  const sites = [
    {name:'Shackleton rim',coord:'89.9° S · 0.0° E',sun:4.2,earth:5.8,light:72,contact:58},
    {name:'Connecting ridge',coord:'89.5° S · 222.0° E',sun:2.8,earth:3.1,light:64,contact:71},
    {name:'Malapert massif',coord:'85.9° S · 0.0° E',sun:6.1,earth:7.4,light:81,contact:86}
  ];
  const svg = (inside, label, view='0 0 700 260') => `<svg viewBox="${view}" role="img" aria-label="${label}" preserveAspectRatio="none">${inside}</svg>`;
  const header = title => `<header class="sr-head"><strong class="sr-brand">SERAPHIM</strong><span class="sr-head-title">${title}</span></header>`;
  const footer = () => `<footer class="sr-footer"><span>Illustrative data</span><span>UTC · Degrees</span></footer>`;
  const details = () => `<div class="sr-foot-details"><details><summary>Data & assumptions</summary><p>All values, dates, windows, curves and terrain in this design study are illustrative. No ephemerides, terrain data or mission calculations are connected.</p></details></div>`;
  const clock = hour => `${String(Math.floor(hour)).padStart(2,'0')}:${hour%1?'30':'00'} UTC`;
  function controls(model, withSite=false) {
    return `<div class="sr-toolbar">${withSite?`<label>Site <select data-action="site" aria-label="Landing site">${sites.map((s,i)=>`<option value="${i}" ${i===model.site?'selected':''}>${s.name}</option>`).join('')}</select></label>`:''}<label>Date <input data-action="date" aria-label="Scenario date" type="date" value="${model.date}"></label><span class="sr-mono sr-small" data-read="clock">${clock(model.hour)}</span></div>`;
  }
  function strips(index, hour, wide=false) {
    const d=sites[index], phase=(hour-12)*.12;
    return `<dl><dt>Sun elevation</dt><dd>${(d.sun+phase).toFixed(1)}°</dd></dl><dl><dt>Earth elevation</dt><dd>${(d.earth-phase*.6).toFixed(1)}°</dd></dl><dl><dt>Sunlight / 24 h</dt><dd>${d.light}%</dd></dl><dl><dt>Earth visible / 24 h</dt><dd>${d.contact}%</dd></dl>`;
  }
  function horizon(index,hour,width=700,height=260) {
    let body='';
    const left=38,right=width-26,top=26,bottom=height-38;
    for(const elevation of [-5,0,5,10]) { const y=bottom-(elevation+5)/15*(bottom-top); body+=`<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="${elevation===0?'#68717c':'#29303a'}" stroke-dasharray="${elevation===0?'4 5':'none'}"/><text x="4" y="${y+4}">${elevation}°</text>`; }
    let ground=[];
    for(let x=left;x<=right;x+=6) {const t=(x-left)/(right-left);const e=1.6+1.2*Math.sin(t*19+index)+.8*Math.sin(t*37);ground.push([x,bottom-(e+5)/15*(bottom-top)]);}
    body+=`<path d="M${left},${bottom} L${ground.map(p=>p.join(',')).join(' L')} L${right},${bottom} Z" fill="#333a42"/><path d="M${ground.map(p=>p.join(',')).join(' L')}" stroke="#8c96a2" stroke-width="1.2" fill="none"/>`;
    const azimuthLabels=width<440?['0°','90°','180°','270°','360°']:['N · 0°','E · 90°','S · 180°','W · 270°','N · 360°'];
    for(let j=0;j<5;j++){const x=left+j*(right-left)/4;body+=`<text x="${x}" y="${height-11}" text-anchor="${j===0?'start':j===4?'end':'middle'}">${azimuthLabels[j]}</text>`;}
    const sunEl=sites[index].sun+(hour-12)*.12, earthEl=sites[index].earth-(hour-12)*.072;
    const sx=left+((hour*7+155+index*19)%360)/360*(right-left),ex=left+(65+index*25)/360*(right-left), sy=bottom-(sunEl+5)/15*(bottom-top),ey=bottom-(earthEl+5)/15*(bottom-top);
    body+=`<circle cx="${sx}" cy="${sy}" r="5" fill="#e6bc72"/><line x1="${sx}" y1="${sy+8}" x2="${sx}" y2="${bottom}" stroke="#e6bc72" opacity=".4"/><text x="${sx}" y="${sy-14}" text-anchor="middle" style="fill:#eff1f3">Sun ${sunEl.toFixed(1)}°</text><rect x="${ex-4}" y="${ey-4}" width="8" height="8" fill="#8eb9df"/><text x="${ex}" y="${ey-14}" text-anchor="middle" style="fill:#eff1f3">Earth ${earthEl.toFixed(1)}°</text>`;
    return svg(body,'Illustrative local horizon, with Sun and Earth elevations. Horizontal axis: azimuth in degrees. Vertical axis: elevation in degrees.',`0 0 ${width} ${height}`);
  }
  function map(index) {
    let body='<rect width="600" height="365" fill="#111519"/>';
    for(let i=0;i<8;i++)body+=`<line x1="${i*85}" y1="0" x2="${i*85}" y2="365" stroke="#242b32"/><line x1="0" y1="${i*60}" x2="600" y2="${i*60}" stroke="#242b32"/>`;
    const features=[[312,211,75],[90,80,68],[466,72,62],[540,298,95],[140,321,44],[216,99,26]];
    features.forEach(([cx,cy,r],i)=>{for(let j=0;j<7;j++){let p=[];for(let a=0;a<=72;a++){let t=a/72*Math.PI*2,rr=(r+j*6)*(1+.05*Math.sin(t*5+i)+.035*Math.sin(t*9));p.push(`${(cx+Math.cos(t)*rr).toFixed(1)},${(cy+Math.sin(t)*rr*.72).toFixed(1)}`);}body+=`<path d="M${p.join(' L')} Z" stroke="${j===0?'#64707c':'#35404b'}" stroke-width="${j===0?1.4:.7}" fill="${j===0?'#1a2026':'none'}"/>`;}});
    const markers=[[320,146],[235,194],[445,265]];
    markers.forEach(([x,y],i)=>{body+=`<circle cx="${x}" cy="${y}" r="${i===index?7:4}" fill="${i===index?'#dce8f1':'#788694'}"/><text x="${x+13}" y="${y+4}" style="fill:${i===index?'#eff1f3':'#a6afb9'}">${['Rim','Ridge','Massif'][i]}</text>`;});
    body+='<text x="565" y="28">N</text><line x1="570" y1="36" x2="570" y2="62" stroke="#a6afb9"/>';
    return svg(body,'Schematic terrain layout showing three illustrative site markers. Positions and contours are not geographic data.','0 0 600 365');
  }
  function track(parts,type='') { return `<div class="sr-track ${type}" aria-hidden="true">${parts.map(([start,width])=>`<i style="left:${start}%;width:${width}%"></i>`).join('')}</div>`; }
  function windows(index,type) {
    if(type==='sun')return [[[0,30],[43,29],[87,13]],[[0,22],[32,31],[75,11]],[[0,45],[51,36]]][index];
    return [[[7,23],[40,18],[66,17]],[[0,25],[35,28],[82,18]],[[0,39],[45,47]]][index];
  }
  function time(model) {
    return `<div class="sr-time"><div class="sr-time-head"><label class="sr-mono" for="sr-time-${model.layout}">${model.date} <output data-read="clock">${clock(model.hour)}</output></label><div class="sr-key"><span><i></i>Sunlight</span><span><i class="sr-earth-key"></i>Earth visible</span></div></div><input id="sr-time-${model.layout}" data-action="time" type="range" min="0" max="23.5" step="0.5" value="${model.hour}" aria-label="Time in UTC hours"><div class="sr-ticks"><span>00:00</span><span>04:00</span><span>08:00</span><span>12:00</span><span>16:00</span><span>20:00</span><span>24:00 UTC</span></div></div>`;
  }
  function key() {return '<div class="sr-key"><span><i></i>Sun</span><span><i class="sr-earth-key"></i>Earth</span><span><i class="sr-terrain-key"></i>Terrain</span></div>';}
  function build(app,model) {
    const d=sites[model.site]; let html='';
    if(model.layout==='trek') {
      html=header('Landing sites')+controls(model)+`<div class="sr-workspace"><aside class="sr-sites"><div class="sr-label">Sites</div>${sites.map((s,i)=>`<button class="sr-site" data-site="${i}" aria-pressed="${i===model.site}"><span>${s.name}</span><span class="sr-mono">${s.coord}</span></button>`).join('')}</aside><div class="sr-map"><span class="sr-map-top">South pole</span><div data-read="map">${map(model.site)}</div><span class="sr-map-note">Schematic terrain</span></div><aside class="sr-inspect" aria-live="polite"><h2 data-read="name">${d.name}</h2><dl class="sr-readout"><dt>Sun elevation</dt><dd data-read="sun">${(d.sun+(model.hour-12)*.12).toFixed(1)}°</dd></dl><dl class="sr-readout"><dt>Earth elevation</dt><dd data-read="earth">${(d.earth-(model.hour-12)*.072).toFixed(1)}°</dd></dl><div class="sr-status"><span>Sun</span><span>Above terrain</span></div><div class="sr-status"><span>Earth</span><span>Visible</span></div></aside></div>`+time(model)+`<div style="padding:0 20px 14px" data-read="bars"><div class="sr-window-row"><span>Sunlight</span>${track(windows(model.site,'sun'))}</div><div class="sr-window-row"><span>Earth visible</span>${track(windows(model.site,'earth'),'sr-contact')}</div></div>`+footer();
    } else if(model.layout==='compare') {
      html=header('Compare sites')+controls(model)+`<main class="sr-main"><h1>Site comparison</h1><table aria-label="Illustrative comparison of landing sites"><thead><tr><th>Site</th><th class="sr-coord-col">Coordinates</th><th class="sr-numeric">Sunlight / 24 h</th><th class="sr-numeric">Earth visible / 24 h</th></tr></thead><tbody>${sites.map((s,i)=>`<tr class="${i===model.site?'sr-selected-row':''}" data-row="${i}"><td class="sr-site-cell"><button data-site="${i}" aria-pressed="${i===model.site}">${s.name}</button></td><td class="sr-coord-col sr-mono sr-small sr-muted">${s.coord}</td><td class="sr-numeric">${s.light}%</td><td class="sr-numeric">${s.contact}%</td></tr>`).join('')}</tbody></table><div class="sr-compare-bottom"><section><div class="sr-panel-heading"><span data-read="name">${d.name}</span><span class="sr-label">Local horizon</span></div><div class="sr-chart" data-read="horizon">${horizon(model.site,model.hour)}</div></section><section><div class="sr-panel-heading"><span>24-hour windows</span><span class="sr-mono sr-small sr-muted" data-read="clock">${clock(model.hour)}</span></div><div data-read="bars" style="padding:22px 0"><div class="sr-window-row"><span>Sunlight</span>${track(windows(model.site,'sun'))}</div><div class="sr-window-row"><span>Earth visible</span>${track(windows(model.site,'earth'),'sr-contact')}</div></div>${key()}</section></div></main>`+time(model)+footer();
    } else if(model.layout==='horizon') {
      html=header('Local horizon')+controls(model,true)+`<main class="sr-horizon-main"><div class="sr-horizon-title"><h1 data-read="name">${d.name}</h1>${key()}</div><div class="sr-chart" data-read="horizon">${horizon(model.site,model.hour)}</div></main><div class="sr-strip" data-read="strip" aria-live="polite">${strips(model.site,model.hour)}</div>`+time(model)+details()+footer();
    } else {
      html=header('Visibility windows')+controls(model)+`<main class="sr-planner"><div class="sr-time-head"><h1 style="font-size:22px;font-weight:600;margin:0">Window planner</h1><div class="sr-key"><span><i></i>Sunlight</span><span><i class="sr-earth-key"></i>Earth visible</span></div></div><div class="sr-plan-head"><span class="sr-label">Site</span><div class="sr-plan-scale"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00 UTC</span></div></div>${sites.map((s,i)=>`<div class="sr-plan-site"><button data-site="${i}" aria-pressed="${i===model.site}">${s.name}</button><div class="sr-plan-tracks" style="--sr-cursor:${model.hour/24*100}%">${track(windows(i,'sun'))}${track(windows(i,'earth'),'sr-contact')}</div></div>`).join('')}</main><div class="sr-plan-summary" aria-live="polite"><span data-read="name">${d.name}</span><span><span class="sr-muted">Sun elevation </span><span class="sr-mono" data-read="sun">${(d.sun+(model.hour-12)*.12).toFixed(1)}°</span></span><span><span class="sr-muted">Earth elevation </span><span class="sr-mono" data-read="earth">${(d.earth-(model.hour-12)*.072).toFixed(1)}°</span></span></div>`+time(model)+footer();
    }
    app.innerHTML=html;
    refreshPlot(app,model);
    app.querySelectorAll('[data-site]').forEach(b=>b.addEventListener('click',()=>{model.site=Number(b.dataset.site);update(app,model);}));
    app.querySelector('[data-action="site"]')?.addEventListener('change',e=>{model.site=Number(e.target.value);update(app,model);});
    app.querySelector('[data-action="time"]').addEventListener('input',e=>{model.hour=Number(e.target.value);update(app,model);});
    app.querySelector('[data-action="date"]').addEventListener('change',e=>{if(e.target.value){model.date=e.target.value;build(app,model);}});
  }
  function update(app,m) {
    const d=sites[m.site];
    app.querySelectorAll('[data-read="name"]').forEach(e=>e.textContent=d.name);
    app.querySelectorAll('[data-read="clock"]').forEach(e=>e.textContent=clock(m.hour));
    app.querySelectorAll('[data-read="sun"]').forEach(e=>e.textContent=(d.sun+(m.hour-12)*.12).toFixed(1)+'°');
    app.querySelectorAll('[data-read="earth"]').forEach(e=>e.textContent=(d.earth-(m.hour-12)*.072).toFixed(1)+'°');
    refreshPlot(app,m);
    const mapNode=app.querySelector('[data-read="map"]');if(mapNode)mapNode.innerHTML=map(m.site);
    const strip=app.querySelector('[data-read="strip"]');if(strip)strip.innerHTML=strips(m.site,m.hour);
    app.querySelectorAll('[data-site]').forEach(e=>e.setAttribute('aria-pressed',String(Number(e.dataset.site)===m.site)));
    app.querySelectorAll('[data-row]').forEach(e=>e.classList.toggle('sr-selected-row',Number(e.dataset.row)===m.site));
    app.querySelectorAll('.sr-plan-tracks').forEach(e=>e.style.setProperty('--sr-cursor',m.hour/24*100+'%'));
    const bars=app.querySelector('[data-read="bars"]');if(bars)bars.innerHTML=`<div class="sr-window-row"><span>Sunlight</span>${track(windows(m.site,'sun'))}</div><div class="sr-window-row"><span>Earth visible</span>${track(windows(m.site,'earth'),'sr-contact')}</div>`;
  }
  function refreshPlot(app,m){const h=app.querySelector('[data-read="horizon"]');if(h&&h.clientWidth>0){h.innerHTML=horizon(m.site,m.hour,h.clientWidth,m.layout==='compare'?170:260);}}
  root.querySelectorAll('.sr-app').forEach(app=>{
    const layout=app.dataset.layout;
    const model={layout,site:0,hour:12,date:'2026-11-15'};
    build(app,model);
    app.setAttribute('aria-label',app.parentElement.dataset.variant);
    new ResizeObserver(()=>refreshPlot(app,model)).observe(app);
  });
})();
</script>

<nav id="reference-layouts" aria-label="Reference layouts">
  <button type="button" data-view="Trek workspace" aria-pressed="true">Trek workspace</button>
  <button type="button" data-view="Site comparison" aria-pressed="false">Site comparison</button>
  <button type="button" data-view="Horizon view" aria-pressed="false">Horizon view</button>
  <button type="button" data-view="Window planner" aria-pressed="false">Window planner</button>
</nav>
<script>
(() => {
  const controls = document.getElementById('reference-layouts');
  const panels = document.getElementById('seraphim-designs');
  controls.addEventListener('click', event => {
    const button = event.target.closest('button[data-view]');
    if (!button) return;
    for (const panel of panels.querySelectorAll('[data-variant]')) {
      panel.hidden = panel.dataset.variant !== button.dataset.view;
    }
    for (const peer of controls.querySelectorAll('button')) {
      peer.setAttribute('aria-pressed', String(peer === button));
    }
  });
})();
</script>

</div>
</body>
</html>
